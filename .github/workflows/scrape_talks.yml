name: Scrape Talk Locations

# Talk files live in _talks/. Tag pushes skip path filters, so the run is
# limited to master, where the regenerated map is committed back.
on:
  push:
    branches: [master]
    paths:
      - '_talks/**'
      - 'talkmap.ipynb'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'  # python-frontmatter needs 3.10+

    - name: Install dependencies
      run: |
        pip install jupyter pandas requests beautifulsoup4 geopy python-frontmatter  # Add other dependencies as needed
        pip install getorg --upgrade

    - name: Run Jupyter Notebook
      run: |
        jupyter nbconvert --to notebook --execute talkmap.ipynb --output talkmap_out.ipynb

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Automated update of talk locations" || echo "No changes to commit"
        git push
