# Builds the site on every pull request so a broken page never reaches master.
# GitHub Pages deploys master itself; this job only verifies the build.
name: Build check

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  jekyll-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
